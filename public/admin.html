<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Seat calls</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin { max-width: 560px; margin: 0 auto; padding: 16px; }
    .admin h1 { font-size: 24px; margin: 8px 0 4px; }
    .admin .help { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
    .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
    .field input[type=password] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--ink); }
    .chamber { background: var(--surface); border-radius: 10px; padding: 12px 16px; margin: 16px 0; }
    .chamber h2 { margin: 0 0 2px; font-size: 20px; }
    .chamber .preview { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
    .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--rule); }
    .row .lbl b { display: block; }
    .row .lbl span { font-size: 13px; color: var(--muted); }
    .step { display: flex; align-items: center; gap: 6px; }
    .step button { width: 44px; height: 44px; font-size: 22px; font-weight: 600; border-radius: 8px; border: 1px solid var(--rule); background: var(--bg); cursor: pointer; }
    .step input { width: 64px; height: 44px; text-align: center; font: inherit; font-size: 20px; font-weight: 800; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
    .save { width: 100%; padding: 14px; font-size: 18px; font-weight: 800; border: none; border-radius: 10px; background: var(--ink); color: var(--bg); cursor: pointer; position: sticky; bottom: 12px; }
    .msg { min-height: 1.5em; margin: 10px 0; font-weight: 600; }
    .msg.err { color: var(--rep); }
  </style>
</head>
<body>
  <main class="admin">
    <h1>Seat calls</h1>
    <p class="help">Update these as the networks project winners, then tap Save. Everyone's page picks it up within a minute. <a href="/#senate">Back to the dashboard</a></p>

    <div class="field">
      <label for="pass">Passcode</label>
      <input id="pass" type="password" autocomplete="current-password">
    </div>

    <div id="forms"></div>
    <p id="msg" class="msg" role="status"></p>
    <button id="save" class="save" type="button">Save</button>
  </main>

  <script type="module">
    import { senateState, houseState, headline } from "/js/control.js";

    const FIELDS = [
      ["calledR", "Called for Republicans", "Races won, of the seats on tonight's ballot"],
      ["calledD", "Called for Democrats", "Count independents who caucus with Democrats here"],
      ["flipsToR", "Flipped to Republicans", "Called seats the other party held before"],
      ["flipsToD", "Flipped to Democrats", "Called seats the other party held before"],
    ];
    const CHAMBERS = [["senate", "Senate", 35], ["house", "House", 435]];
    let data = { senate: {}, house: {} };
    let dirty = false;

    const $pass = document.getElementById("pass");
    const $msg = document.getElementById("msg");
    try { $pass.value = localStorage.getItem("seat-pass") || ""; } catch {}

    function draw() {
      document.getElementById("forms").innerHTML = CHAMBERS.map(([c, name, max]) => {
        const s = c === "senate" ? senateState(data) : houseState(data);
        return `<section class="chamber"><h2>${name}</h2><p class="preview">Page will say: ${headline(c, s)} (${s.R} R, ${s.D} D, ${s.uncalled} uncalled)</p>
          ${FIELDS.map(([f, label, help]) => `<div class="row"><div class="lbl"><b>${label}</b><span>${help}</span></div>
            <div class="step"><button type="button" data-c="${c}" data-f="${f}" data-d="-1" aria-label="${name} ${label} minus one">−</button>
            <input inputmode="numeric" pattern="[0-9]*" data-c="${c}" data-f="${f}" value="${data[c][f] || 0}" aria-label="${name} ${label}">
            <button type="button" data-c="${c}" data-f="${f}" data-d="1" aria-label="${name} ${label} plus one">+</button></div></div>`).join("")}
        </section>`;
      }).join("");
    }

    document.getElementById("forms").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-d]");
      if (!b) return;
      const { c, f, d } = b.dataset;
      data[c][f] = Math.max(0, (data[c][f] || 0) + Number(d));
      dirty = true;
      draw();
      $msg.textContent = "Not saved yet";
      $msg.className = "msg";
    });
    document.getElementById("forms").addEventListener("change", (e) => {
      const i = e.target.closest("input[data-f]");
      if (!i) return;
      data[i.dataset.c][i.dataset.f] = Math.max(0, parseInt(i.value, 10) || 0);
      dirty = true;
      draw();
      $msg.textContent = "Not saved yet";
      $msg.className = "msg";
    });

    document.getElementById("save").addEventListener("click", async () => {
      $msg.className = "msg";
      $msg.textContent = "Saving…";
      try { localStorage.setItem("seat-pass", $pass.value); } catch {}
      const res = await fetch("/api/control", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Passcode": $pass.value },
        body: JSON.stringify({ senate: data.senate, house: data.house }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        $msg.className = "msg err";
        $msg.textContent = body.error || `Save failed (HTTP ${res.status})`;
        return;
      }
      data = { senate: body.senate, house: body.house };
      dirty = false;
      draw();
      $msg.textContent = `Saved at ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
    });

    window.addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });

    const res = await fetch("/api/control", { cache: "no-store" });
    if (res.ok) {
      const body = await res.json();
      data = { senate: body.senate || {}, house: body.house || {} };
    } else {
      $msg.className = "msg err";
      $msg.textContent = "Couldn't load the current numbers.";
    }
    draw();
  </script>
</body>
</html>
